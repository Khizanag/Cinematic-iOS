# SwiftLint configuration for Cinematic. The rules live in ios-toolkit; this
# file adds only what is specific to this app.
# Run `swiftlint --strict` — it must pass with zero violations before any commit.

parent_config: https://raw.githubusercontent.com/Khizanag/ios-toolkit/v1.0.0/swiftlint/base.yml

included:
  - Cinematic
  - CinematicTests
  - CinematicUITests
  - Package

excluded:
  - .build
  - DerivedData
  - Pods
  - "**/.build"
  - "**/Generated"
  - "**/*.generated.swift"
  - Cinematic/Resource
  - Package/CinematicPresentation/Sources/CinematicPresentation/Resources

# Identifiers (API genre IDs, HTTP status codes) are opaque — separators only
# help genuinely large quantities.
number_separator:
  minimum_length: 6
