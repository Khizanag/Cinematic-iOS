name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: Khizanag/iOS-Toolkit/.github/workflows/ios-ci.yml@v1.5.0
    with:
      xcode: '27'
      packages: '["Package/CinematicDomain", "Package/CinematicData", "Package/CinematicComparison"]'
      xcodebuild: >-
        [{"name": "CinematicDesign (simulator)", "scheme": "CinematicDesign", "directory": "Package/CinematicDesign"},
         {"name": "CinematicPresentation (simulator)", "scheme": "CinematicPresentation", "directory": "Package/CinematicPresentation"},
         {"name": "Cinematic (simulator)", "scheme": "Cinematic", "project": "Cinematic.xcodeproj"}]

  coverage:
    name: Coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Select latest Xcode 27
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
      - name: Run pure-package tests with coverage
        run: |
          for package in CinematicDomain CinematicData; do
            swift test --package-path "Package/$package" --enable-code-coverage
          done
      - name: Write coverage badge
        run: python3 Scripts/coverage-badge.py
      - name: Commit badge when it changes
        run: |
          if git diff --quiet docs/coverage.json; then
            echo "coverage unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/coverage.json
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi
